                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource_mimir}"
                  },
                  "editorMode": "code",
                  "expr": "(sum by (host_name) (process_runtime_jvm_memory_usage{jvm_memory_type=\"heap\", type=\"committed\", host_name=~\"$node\"}) or sum by (host_name) (jvm_memory_committed_bytes{area=\"heap\", host_name=~\"$node\"}) or max by (host_name) (process_memory_usage{host_name=~\"$node\", process_executable_name=~\".*[Jj]ava.*\"})) / 1e9",
                  "legendFormat": "Committed Heap (GB) — {{host_name}}",
                  "range": true,
                  "refId": "C"
                }
              ],
              "description": "NR heap used/max/committed — JVM metrics with process_memory_usage fallback."
            },
