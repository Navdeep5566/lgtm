                  "editorMode": "code",
                  "expr": "histogram_quantile(0.50, sum by (le, job) (rate(http_server_request_duration_bucket{job=~\"$service\", host_name=~\"$node\", http_route!~\"/actuator.*|/health.*\"}[5m]))) * 1000",
                  "legendFormat": "p50 ms",
