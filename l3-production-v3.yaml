apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: d1c-l3-production
  namespace: observability
  labels:
    dashboards: grafana-lgtm
    app.kubernetes.io/name: d1c-l3-production
    app.kubernetes.io/component: grafana-dashboard
    app.kubernetes.io/part-of: lgtm-observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-lgtm
  folder: LGTM
  json: |
    {
      "id": null,
      "uid": "d1c-l3-production",
      "title": "D1C L3 Production Dashboard",
      "description": "L3 production platform dashboard (POD1, POD2, EWB, SBNA). Log panels use NR-matched LogQL filters; hosts from Mimir/Loki variables.",
      "tags": [
        "d1c",
        "l3",
        "production",
        "platform",
        "postgres",
        "daily-ops"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 3,
      "refresh": "30s",
      "editable": true,
      "graphTooltip": 1,
      "liveNow": false,
      "fiscalYearStartMonth": 0,
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m"
        ],
        "time_options": [
          "5m",
          "15m",
          "30m",
          "1h",
          "3h",
          "6h",
          "12h",
          "24h"
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource_mimir",
            "type": "datasource",
            "query": "prometheus",
            "label": "Mimir Datasource",
            "hide": 0,
            "current": {},
            "refresh": 1
          },
          {
            "name": "datasource_loki",
            "type": "datasource",
            "query": "loki",
            "label": "Loki Datasource",
            "hide": 0,
            "current": {},
            "refresh": 1
          },
          {
            "name": "platform",
            "type": "custom",
            "label": "Platform (NR page)",
            "description": "Organizational — expand the matching row. Host filtering uses Node / Host dropdown.",
            "query": "POD1,POD2,EWB,SBNA",
            "options": [
              {
                "text": "POD1",
                "value": "POD1",
                "selected": true
              },
              {
                "text": "POD2",
                "value": "POD2",
                "selected": false
              },
              {
                "text": "EWB",
                "value": "EWB",
                "selected": false
              },
              {
                "text": "SBNA",
                "value": "SBNA",
                "selected": false
              }
            ],
            "current": {
              "text": "POD1",
              "value": "POD1"
            },
            "hide": 0
          },
          {
            "name": "log_tag_prefix",
            "type": "custom",
            "label": "Log Tag Prefix",
            "description": "NR tags.Name prefix (e.g. nuob, muob, nuobp2, ewbk, sant). Match your Loki tags_Name label.",
            "query": "nuob,muob,nuobp2,ewbk,sant",
            "options": [
              {
                "text": "nuob (POD1)",
                "value": "nuob",
                "selected": true
              },
              {
                "text": "muob (POD1 alt)",
                "value": "muob",
                "selected": false
              },
              {
                "text": "nuobp2 (POD2)",
                "value": "nuobp2",
                "selected": false
              },
              {
                "text": "ewbk (EWB)",
                "value": "ewbk",
                "selected": false
              },
              {
                "text": "sant (SBNA)",
                "value": "sant",
                "selected": false
              }
            ],
            "current": {
              "text": "nuob (POD1)",
              "value": "nuob"
            },
            "hide": 0
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(target_info, k8s_namespace_name)",
            "definition": "label_values(target_info, k8s_namespace_name)",
            "label": "Namespace",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1,
            "hide": 0
          },
          {
            "name": "node",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(system_cpu_time, host_name)",
            "definition": "label_values(system_cpu_time, host_name)",
            "label": "Node / Host",
            "description": "Discovered from Mimir system_cpu_time — no hardcoded NR hostnames.",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1,
            "hide": 0
          },
          {
            "name": "service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(http_server_request_duration_bucket, job)",
            "definition": "label_values(http_server_request_duration_bucket, job)",
            "label": "App / Job",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1,
            "hide": 0
          },
          {
            "name": "log_host",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource_loki}"
            },
            "query": "label_values({host_name=~\".+\"}, host_name)",
            "definition": "label_values({host_name=~\".+\"}, host_name)",
            "label": "Log Host",
            "description": "Discovered from Loki host_name label.",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1,
            "hide": 0
          }
