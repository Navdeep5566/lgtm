              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource_mimir}"
                  },
                  "editorMode": "code",
                  "expr": "(sum by (host_name) (process_runtime_jvm_memory_usage{jvm_memory_type=\"heap\", type=\"used\", host_name=~\"$node\"}) or sum by (host_name) (jvm_memory_used_bytes{area=\"heap\", host_name=~\"$node\"}) or max by (host_name) (process_memory_usage{host_name=~\"$node\", process_executable_name=~\".*[Jj]ava.*\"}) or max by (host_name) (process_memory_usage{host_name=~\"$node\"})) / 1e9",
                  "legendFormat": "Used Heap (GB) — {{host_name}}",
                  "range": true,
                  "refId": "A"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource_mimir}"
                  },
                  "editorMode": "code",
                  "expr": "(sum by (host_name) (process_runtime_jvm_memory_usage{jvm_memory_type=\"heap\", type=\"limit\", host_name=~\"$node\"}) or sum by (host_name) (jvm_memory_max_bytes{area=\"heap\", host_name=~\"$node\"}) or max by (host_name) (process_memory_usage{host_name=~\"$node\", process_executable_name=~\".*[Jj]ava.*\"})) / 1e9",
                  "legendFormat": "Max Heap (GB) — {{host_name}}",
                  "range": true,
                  "refId": "B"
