apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: k8s-workloads-dashboard
  namespace: observability
  labels:
    dashboards: grafana-lgtm
    app.kubernetes.io/name: k8s-workloads-dashboard
    app.kubernetes.io/component: grafana-dashboard
    app.kubernetes.io/part-of: lgtm-observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-lgtm
  folder: LGTM
  json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "name": "Prometheus Alerts",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "enable": true,
            "hide": false,
            "iconColor": "red",
            "expr": "ALERTS{alertstate=\"firing\", alertname=~\"Kube.*|.*Pod.*|.*Deployment.*|.*StatefulSet.*|.*DaemonSet.*|.*PVC.*|.*PV.*\"}",
            "tagKeys": "alertname,severity",
            "titleFormat": "{{alertname}}",
            "textFormat": "{{annotations.summary}}",
            "useValueForTime": false
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "liveNow": false,
      "panels": [
        {
          "id": 17,
          "type": "row",
          "title": "Failed pod visibility",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 1,
          "type": "timeseries",
          "title": "Failed phase pods",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "sum by(namespace, pod) (kube_pod_status_phase{phase=\"Failed\", namespace=~\"$namespace\"} == 1)",
              "refId": "A",
              "legendFormat": "{{namespace}}/{{pod}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "last",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Pending phase pods",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "sum by(namespace, pod) (kube_pod_status_phase{phase=\"Pending\", namespace=~\"$namespace\"} == 1)",
              "refId": "A",
              "legendFormat": "{{namespace}}/{{pod}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "last",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "CrashLoopBackOff containers",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "sum by(namespace, pod, container) (kube_pod_container_status_waiting_reason{reason=\"CrashLoopBackOff\", namespace=~\"$namespace\"} == 1)",
              "refId": "A",
              "legendFormat": "{{namespace}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "last",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "OOMKilled containers",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "sum by(namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason=\"OOMKilled\", namespace=~\"$namespace\"} == 1)",
              "refId": "A",
              "legendFormat": "{{namespace}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "last",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Restart spikes",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "sum by(namespace, pod, container) (increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h]))",
              "refId": "A",
              "legendFormat": "{{namespace}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "last",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 18,
          "type": "row",
          "title": "Resource Utilization",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory usage by pod",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 23
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "sum by(namespace, pod) (container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"$pod\"})",
              "refId": "A",
              "legendFormat": "{{namespace}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "last",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU usage by pod",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 23
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "sum by(namespace, pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", pod=~\"$pod\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{namespace}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "last",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Memory Info",
          "description": "Total memory usage, requests, and limits for the selected namespace/pod scope.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 31
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "sum(container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"$pod\", container!=\"\"})",
              "refId": "A",
              "legendFormat": "Usage",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "sum(kube_pod_container_resource_requests{namespace=~\"$namespace\", pod=~\"$pod\", resource=\"memory\"})",
              "refId": "B",
              "legendFormat": "Requests",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "sum(kube_pod_container_resource_limits{namespace=~\"$namespace\", pod=~\"$pod\", resource=\"memory\"})",
              "refId": "C",
              "legendFormat": "Limits",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "unit": "decbytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 8589934592
                  },
                  {
                    "color": "red",
                    "value": 12884901888
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Usage"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Usage"
                  },
                  {
                    "id": "unit",
                    "value": "decbytes"
                  },
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "blue",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Requests"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Requests"
                  },
                  {
                    "id": "unit",
                    "value": "decbytes"
                  },
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "green",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Limits"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Limits"
                  },
                  {
                    "id": "unit",
                    "value": "decbytes"
                  },
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "orange",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "wideLayout": true,
            "orientation": "horizontal",
            "showPercentChange": false
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "CPU Info",
          "description": "Total CPU usage, requests, and limits (cores) for the selected namespace/pod scope.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 31
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", pod=~\"$pod\"}[5m]))",
              "refId": "A",
              "legendFormat": "Usage",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "sum(kube_pod_container_resource_requests{resource=\"cpu\", namespace=~\"$namespace\", pod=~\"$pod\"})",
              "refId": "B",
              "legendFormat": "Requests",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "sum(kube_pod_container_resource_limits{resource=\"cpu\", namespace=~\"$namespace\", pod=~\"$pod\"})",
              "refId": "C",
              "legendFormat": "Limits",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 2,
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 4
                  },
                  {
                    "color": "red",
                    "value": 8
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Usage"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Usage (cores)"
                  },
                  {
                    "id": "unit",
                    "value": "short"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Requests"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Requests (cores)"
                  },
                  {
                    "id": "unit",
                    "value": "short"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Limits"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Limits (cores)"
                  },
                  {
                    "id": "unit",
                    "value": "short"
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "wideLayout": true,
            "orientation": "horizontal",
            "showPercentChange": false
          }
        },
        {
          "id": 9,
          "type": "bargauge",
          "title": "Resource usage",
          "description": "CPU and memory utilization as a percentage of requested resources.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 39
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", pod=~\"$pod\"}[5m])) / clamp_min(sum(kube_pod_container_resource_requests{namespace=~\"$namespace\", pod=~\"$pod\", resource=\"cpu\"}), 1e-9)",
              "refId": "A",
              "legendFormat": "CPU usage %",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "sum(container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"$pod\", container!=\"\"}) / clamp_min(sum(kube_pod_container_resource_requests{namespace=~\"$namespace\", pod=~\"$pod\", resource=\"memory\"}), 1)",
              "refId": "B",
              "legendFormat": "Memory usage %",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.85
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU usage %"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "CPU usage %"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Memory usage %"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Memory usage %"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "/Value #A/"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "CPU usage %"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "/Value #B/"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Memory usage %"
                  }
                ]
              }
            ]
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "namePlacement": "left",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "valueMode": "color"
          }
        },
        {
          "id": 16,
          "type": "stat",
          "title": "Pod uptime",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 12,
            "y": 38
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "max(time() - kube_pod_start_time{namespace=~\"$namespace\", pod=~\"$pod\"})",
              "refId": "A",
              "legendFormat": "Pod uptime",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 19,
          "type": "row",
          "title": "Cluster level metrics",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 44
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Total nodes in cluster",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 45
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "count(kube_node_info)",
              "refId": "A",
              "legendFormat": "Total nodes in cluster",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Node Ready status",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 45
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "expr": "kube_node_status_condition{condition=\"Ready\", status=\"true\"}",
