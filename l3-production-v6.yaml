apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: d1c-l3-production
  namespace: observability
  labels:
    dashboards: grafana-lgtm
    app.kubernetes.io/name: d1c-l3-production
    app.kubernetes.io/component: grafana-dashboard
    app.kubernetes.io/part-of: lgtm-observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-lgtm
  folder: LGTM
  json: |
    {
      "id": null,
      "uid": "d1c-l3-production",
      "title": "D1C L3 Production Dashboard",
      "description": "L3 production platform dashboard migrated from New Relic (POD1, POD2, EWB, SBNA). v6: fixed LogQL parse error (removed invalid | limit pipe), tomcat_thread_count for thread panel.",
      "tags": [
        "d1c",
        "l3",
        "production",
        "platform",
        "postgres",
        "daily-ops"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 6,
      "refresh": "30s",
      "editable": true,
      "graphTooltip": 1,
      "liveNow": false,
      "fiscalYearStartMonth": 0,
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m"
        ],
        "time_options": [
          "5m",
          "15m",
          "30m",
          "1h",
          "3h",
          "6h",
          "12h",
          "24h"
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource_mimir",
            "type": "datasource",
            "query": "prometheus",
            "label": "Mimir Datasource",
            "hide": 0,
            "current": {},
            "refresh": 1
          },
          {
            "name": "datasource_loki",
            "type": "datasource",
            "query": "loki",
            "label": "Loki Datasource",
            "hide": 0,
            "current": {},
            "refresh": 1
          },
          {
            "name": "log_namespace",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource_loki}"
            },
            "query": "label_values({}, k8s_namespace_name)",
            "definition": "label_values({}, k8s_namespace_name)",
            "label": "Log Namespace",
            "description": "Discovered from Loki (k8s_namespace_name). No hardcoded NR muob/nuob prefixes.",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "allowCustomValue": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1,
            "hide": 0
          },
          {
            "name": "log_service",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource_loki}"
            },
            "query": "label_values({k8s_namespace_name=~\"$log_namespace\"}, service_name)",
            "definition": "label_values({k8s_namespace_name=~\"$log_namespace\"}, service_name)",
            "label": "Log Service",
            "description": "Discovered from Loki service_name. Pick app/batch/MQ services for your cluster.",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "allowCustomValue": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1,
            "hide": 0
          },
          {
            "name": "platform",
            "type": "custom",
            "label": "Platform (NR page)",
            "description": "Organizational \u2014 expand the matching row. Host filtering uses Node / Host dropdown.",
            "query": "POD1,POD2,EWB,SBNA",
            "options": [
              {
                "text": "POD1",
                "value": "POD1",
                "selected": true
              },
              {
                "text": "POD2",
                "value": "POD2",
                "selected": false
              },
              {
                "text": "EWB",
                "value": "EWB",
                "selected": false
              },
              {
                "text": "SBNA",
                "value": "SBNA",
                "selected": false
              }
            ],
            "current": {
              "text": "POD1",
              "value": "POD1"
            },
            "hide": 0
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(target_info, k8s_namespace_name)",
            "definition": "label_values(target_info, k8s_namespace_name)",
            "label": "Namespace",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1,
            "hide": 0
          },
          {
            "name": "node",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(system_cpu_time, host_name)",
            "definition": "label_values(system_cpu_time, host_name)",
            "label": "Node / Host",
            "description": "Discovered from Mimir system_cpu_time \u2014 no hardcoded NR hostnames.",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1,
            "hide": 0
          },
          {
            "name": "service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(http_server_request_duration_bucket, job)",
            "definition": "label_values(http_server_request_duration_bucket, job)",
            "label": "App / Job",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1,
            "hide": 0
          },
          {
            "name": "log_host",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource_loki}"
            },
            "query": "label_values({k8s_namespace_name=~\"$log_namespace\"}, k8s_pod_name)",
            "definition": "label_values({k8s_namespace_name=~\"$log_namespace\"}, k8s_pod_name)",
            "label": "Log Pod (optional)",
            "description": "Optional k8s pod filter from Loki. Primary filters: Log Namespace + Log Service. Node / Host aligns Mimir metrics.",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1,
            "hide": 2
          }
