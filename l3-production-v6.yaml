                  "legendFormat": "Used memory (GB) \u2014 {{host_name}}",
                  "range": true,
                  "refId": "A"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource_mimir}"
                  },
                  "editorMode": "code",
                  "expr": "sum by (host_name) (system_memory_usage{state=~\"used|free|buffered|cached\", host_name=~\"$node\"}) / 1e9",
