              "id": 4,
              "title": "Node 01 CPU",
              "type": "timeseries",
              "gridPos": {
                "x": 0,
                "y": 9,
                "w": 8,
                "h": 9
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              },
              "pluginVersion": "13.0.1",
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "linear",
                    "lineWidth": 1,
                    "fillOpacity": 10,
                    "showPoints": "never"
                  },
                  "unit": "percent",
                  "min": 0,
                  "max": 100
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource_mimir}"
                  },
                  "editorMode": "code",
                  "expr": "100 * (1 - sum by (host_name) (rate(system_cpu_time{state=\"idle\", host_name=~\"$node\"}[5m])) / clamp_min(sum by (host_name) (rate(system_cpu_time{host_name=~\"$node\"}[5m])), 1e-9))",
                  "legendFormat": "CPU used %",
                  "range": true,
                  "refId": "A"
