              },
              "description": "NR-matched message filters for `Critical Application Errors(App & Batch JVM)`. Stream selection uses Loki **Log Namespace** + **Log Service** (discovered dynamically). Uses Loki-safe `.+` matchers when All is selected. Results capped via Grafana maxLines (500).",
              "datasource": {
                "type": "loki",
                "uid": "${datasource_loki}"
