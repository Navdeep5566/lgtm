apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: prod-muq6-platform-ibm-mq
  namespace: observability
  labels:
    dashboards: grafana-lgtm
    app.kubernetes.io/name: prod-muq6-platform-ibm-mq
    app.kubernetes.io/component: grafana-dashboard
    app.kubernetes.io/part-of: lgtm-observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-lgtm
  folder: LGTM
  json: |
    {
      "id": null,
      "uid": "prod-muq6-platform-ibm-mq",
      "title": "PROD Platform - IBM MQ",
      "description": "IBM MQ dashboard. v13: MQ Server Logs panel filters IBM MQ-related log lines only.",
      "tags": [
        "d1c",
        "ibm-mq",
        "prod",
        "platform",
        "middleware",
        "ibmmq"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 13,
      "refresh": "30s",
      "editable": true,
      "graphTooltip": 1,
      "liveNow": false,
      "fiscalYearStartMonth": 0,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m"
        ],
        "time_options": [
          "5m",
          "15m",
          "30m",
          "1h",
          "6h",
          "12h",
          "24h",
          "2d",
          "7d"
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "name": "Firing Alerts",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "enable": true,
            "hide": false,
            "iconColor": "red",
            "expr": "ALERTS{alertstate=\"firing\", alertname=~\".*MQ.*|.*IBM.*|.*Queue.*\"}",
            "titleFormat": "{{alertname}}",
            "textFormat": "{{annotations.summary}}"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource_mimir",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Mimir Datasource",
            "refresh": 1
          },
          {
            "name": "datasource_loki",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 0,
            "label": "Loki Datasource",
            "refresh": 1
          },
          {
            "name": "hostname",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values({__name__=~\"ibmmq_.*\"}, host_name)",
            "definition": "label_values({__name__=~\"ibmmq_.*\"}, host_name)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Host (host_name)",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "hostname_alt",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values({__name__=~\"ibmmq_.*\"}, host_hostname)",
            "definition": "label_values({__name__=~\"ibmmq_.*\"}, host_hostname)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 2,
            "label": "Host (host_hostname)",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "qmgr",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values({__name__=~\"ibmmq_.*\"}, qmgr)",
            "definition": "label_values({__name__=~\"ibmmq_.*\"}, qmgr)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Queue Manager",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "queue",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(ibmmq_queue_mqput_mqput1_count, queue)",
            "definition": "label_values(ibmmq_queue_mqput_mqput1_count, queue)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Queue",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "channel",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values({__name__=~\"ibmmq_channel_.*\", qmgr=~\"$qmgr\"}, channel)",
            "definition": "label_values({__name__=~\"ibmmq_channel_.*\", qmgr=~\"$qmgr\"}, channel)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Channel",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "log_host",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource_loki}"
            },
            "query": "label_values({host_name=~\".+\"}, host_name)",
            "definition": "label_values({host_name=~\".+\"}, host_name)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Log Host (host_name)",
            "refresh": 2,
            "sort": 1,
            "description": "Discovered from Loki label `host_name` — works on any cluster, no hardcoded hostnames."
          },
          {
            "name": "log_host_alt",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource_loki}"
            },
            "query": "label_values({host=~\".+\"}, host)",
            "definition": "label_values({host=~\".+\"}, host)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Log Host (host)",
            "refresh": 2,
            "sort": 1,
            "description": "Discovered from Loki label `host` — works on any cluster, no hardcoded hostnames."
          },
          {
            "name": "log_hostname",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource_loki}"
            },
            "query": "label_values({hostname=~\".+\"}, hostname)",
            "definition": "label_values({hostname=~\".+\"}, hostname)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 2,
            "label": "Log Host (hostname)",
            "refresh": 2,
            "sort": 1,
            "description": "Discovered from Loki label `hostname` — works on any cluster, no hardcoded hostnames."
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Diagnostics — IBM MQ metrics in Mimir",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "text",
          "title": "Metric naming in this environment",
          "gridPos": {
            "h": 4,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "options": {
            "mode": "markdown",
            "content": "**v10 — time_since metrics not in Mimir**\n\nYour Explore: `count(ibmmq_queue_time_since_get)` = **no data**. YAML cannot fix missing metrics — panels now use **proxies** that exist in Mimir:\n\n| NR panel | NR metric (missing) | Grafana proxy (in Mimir) |\n|---|---|---|\n| Time Since GET | `ibmmq_queue_time_since_get` | `ibmmq_queue_average_queue_time_seconds` |\n| Time Since PUT | `ibmmq_queue_time_since_put` | `ibmmq_queue_oldest_message_age` |\n\nTo get exact NR metrics, enable **MQI queue statistics** (`time_since_get`, `time_since_put`) on your IBM MQ metrics collector."
          }
        },
        {
          "id": 107,
          "type": "stat",
          "title": "Series: ibmmq_queue_mqput_mqput1_count",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "count(ibmmq_queue_mqput_mqput1_count)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 108,
          "type": "stat",
          "title": "time_since_get in Mimir (need collector)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "count(ibmmq_queue_time_since_get)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          },
          "description": "Red 0 = metric not exported. Enable on IBM MQ OTel/Prometheus collector."
        },
        {
          "id": 109,
          "type": "stat",
          "title": "time_since_put in Mimir (need collector)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "count(ibmmq_queue_time_since_put)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "IBM MQ metric names (ibmmq_*)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "count(count by (__name__) ({__name__=~\"ibmmq_.*\"}))",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "IBM MQ time series (ibmmq_*)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 24,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "count({__name__=~\"ibmmq_.*\"})",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Queue managers (qmgr label)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 28,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "count(count by (qmgr) ({__name__=~\"ibmmq_qmgr_.*\"}))",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 6,
          "type": "table",
          "title": "Top ibmmq_* metrics in Mimir",
          "gridPos": {
            "h": 5,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "topk(20, count by (__name__) ({__name__=~\"ibmmq_.*\"}))",
              "refId": "A",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "filterable": true
              }
            }
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "__name__": "Metric",
                  "Value": "Series count"
                }
              }
            }
          ]
        },
        {
          "id": 106,
          "type": "table",
          "title": "Available ibmmq_queue_* metrics (incl. time_since if collected)",
          "gridPos": {
            "h": 5,
            "w": 24,
            "x": 0,
            "y": 10
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "topk(30, count by (__name__) ({__name__=~\"ibmmq_queue_.*\"}))",
              "refId": "A",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "filterable": true
              }
            }
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "__name__": "Metric",
                  "Value": "Series count"
                }
              }
            }
          ]
        },
        {
          "id": 7,
          "type": "row",
          "title": "Queue Managers",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Queue Managers",
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 0,
            "y": 16
          },
          "description": "Unique queue managers from ibmmq_qmgr_active_listeners.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "count(count by (qmgr) (ibmmq_qmgr_active_listeners{qmgr=~\"$qmgr\"}))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Connections (listeners + services)",
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 4,
            "y": 16
          },
          "description": "ibmmq_qmgr_active_listeners + ibmmq_qmgr_active_services.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum(ibmmq_qmgr_active_listeners{qmgr=~\"$qmgr\"}) + sum(ibmmq_qmgr_active_services{qmgr=~\"$qmgr\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Connections",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum by (qmgr) (ibmmq_qmgr_active_listeners{qmgr=~\"$qmgr\"}) + sum by (qmgr) (ibmmq_qmgr_active_services{qmgr=~\"$qmgr\"})",
              "refId": "A",
              "legendFormat": "{{qmgr}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 25,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Errors",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 16
          },
          "description": "Sum of ibmmq_qmgr_failed_* operation counters.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum by (qmgr) (\n  avg_over_time(ibmmq_qmgr_failed_browse_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqget_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqinq_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqopen_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqput_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqput1_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqsubrq_count{qmgr=~\"$qmgr\"}[5m])\n)",
              "refId": "A",
              "legendFormat": "{{qmgr}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            }
