apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: d1c-slo-dashboard-v2
  namespace: observability
  labels:
    dashboards: grafana-lgtm
    app.kubernetes.io/name: d1c-slo-dashboard-v2
    app.kubernetes.io/component: grafana-dashboard
    app.kubernetes.io/part-of: lgtm-observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-lgtm
  folder: LGTM
  json: |
    {
      "id": null,
      "uid": "d1c-slo-metrics-v2",
      "title": "D1C SLO Metrics (v2 Industry Standard)",
      "description": "Engineering SLO dashboard (Google SRE style): event-based SLIs, error budget remaining/consumed, multi-window burn rates (1h/6h/3d/30d), RED golden signals, good/bad events, per-job scorecard, dependency saturation. Metrics: http_server_request_duration_* aligned with app dashboards. Excludes actuator/health. Does not overwrite uid d1c-slo-metrics.",
      "tags": [
        "d1c",
        "slo",
        "sre",
        "opentelemetry",
        "golden-signals",
        "error-budget",
        "v2"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "graphTooltip": 1,
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "name": "SLO Alerts",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "enable": true,
            "hide": false,
            "iconColor": "red",
            "expr": "ALERTS{alertstate=\"firing\", alertname=~\".*SLO.*|.*Error.*|.*Latency.*|.*Availability.*|.*Burn.*\"}",
            "titleFormat": "{{alertname}}",
            "textFormat": "{{annotations.summary}}"
          },
          {
            "name": "Deployments",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "enable": true,
            "hide": false,
            "iconColor": "blue",
            "expr": "changes(kube_deployment_status_observed_generation{namespace=~\"$namespace\"}[5m]) > 0",
            "titleFormat": "Deployment change: {{deployment}}"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource_mimir",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Mimir Datasource"
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(target_info, k8s_namespace_name) or label_values(kube_namespace_status_phase, namespace)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "label": "Namespace",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(http_server_request_duration_bucket, job)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "label": "App / Job",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "slo_latency_ms",
            "type": "custom",
            "query": "200,500,1000,2000",
            "current": {
              "text": "500",
              "value": "500"
            },
            "label": "Latency Target (ms)",
            "hide": 0
          },
          {
            "name": "slo_availability_pct",
            "type": "custom",
            "query": "99,99.5,99.9,99.95,99.99",
            "current": {
              "text": "99.9",
              "value": "99.9"
            },
            "label": "Availability Target (%)",
            "hide": 0
          },
          {
            "name": "deployment",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(kube_deployment_metadata_generation{namespace=~\"$namespace\"}, deployment)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "label": "Deployment",
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "SLO Overview (Engineering Objectives)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 101,
          "type": "gauge",
          "title": "Availability SLI (30d)",
          "description": "Event-based availability SLI over 30 days vs SLO target variable.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "(sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\", http_response_status_code!~\"5..\"}[30d])) / clamp_min(sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\"}[30d])), 1))",
              "refId": "A",
              "legendFormat": "Availability 30d",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.99
                  },
                  {
                    "color": "green",
                    "value": 0.999
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "showThresholdMarkers": true
          }
        },
        {
          "id": 102,
          "type": "gauge",
          "title": "Error Budget Remaining",
          "description": "Google SRE style: remaining monthly error budget for selected availability SLO.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "clamp(1 - ((1 - (sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\", http_response_status_code!~\"5..\"}[30d])) / clamp_min(sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\"}[30d])), 1))) / clamp_min((1 - ($slo_availability_pct / 100)), 1e-9)), 0, 1)",
              "refId": "A",
              "legendFormat": "Budget left",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.2
                  },
                  {
                    "color": "yellow",
                    "value": 0.5
                  },
                  {
                    "color": "green",
                    "value": 0.8
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "showThresholdMarkers": true
          }
        },
        {
          "id": 103,
          "type": "stat",
          "title": "Error Rate (5m)",
          "description": "Current 5xx ratio (SLO error SLI).",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\", http_response_status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\"}[5m])), 1e-9)",
              "refId": "A",
              "legendFormat": "Error rate",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.001
                  },
                  {
                    "color": "red",
                    "value": 0.01
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 104,
          "type": "stat",
          "title": "Latency p95 vs Target",
          "description": "p95 / target (>1 means missing latency SLO).",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "(histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_bucket{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\"}[5m])))) / ($slo_latency_ms / 1000)",
              "refId": "A",
              "legendFormat": "p95 / target",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 1.5
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 110,
          "type": "row",
          "title": "Error Budget Burn Rate (Multi-Window — Industry Standard)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 7
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 111,
          "type": "stat",
          "title": "Burn Rate 1h (fast)",
          "description": "Fast burn: how quickly budget is consuming over 1h. >14.4 ≈ exhausts 30d budget in ~2h (page-worthy).",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "clamp_min((1 - (sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\", http_response_status_code!~\"5..\"}[1h])) / clamp_min(sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\"}[1h])), 1))) / clamp_min((1 - ($slo_availability_pct / 100)), 1e-9), 0)",
              "refId": "A",
              "legendFormat": "1h burn",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 6
                  },
                  {
                    "color": "orange",
                    "value": 14.4
                  },
                  {
                    "color": "red",
                    "value": 20
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 112,
          "type": "stat",
          "title": "Burn Rate 6h",
          "description": "Medium window burn rate for ticket/page decisioning.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "clamp_min((1 - (sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\", http_response_status_code!~\"5..\"}[6h])) / clamp_min(sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\"}[6h])), 1))) / clamp_min((1 - ($slo_availability_pct / 100)), 1e-9), 0)",
              "refId": "A",
              "legendFormat": "6h burn",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 3
                  },
                  {
                    "color": "orange",
                    "value": 6
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 113,
          "type": "stat",
          "title": "Burn Rate 3d (slow)",
          "description": "Slow burn over 3d — catches sustained degradation.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "clamp_min((1 - (sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\", http_response_status_code!~\"5..\"}[3d])) / clamp_min(sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\"}[3d])), 1))) / clamp_min((1 - ($slo_availability_pct / 100)), 1e-9), 0)",
              "refId": "A",
              "legendFormat": "3d burn",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 114,
          "type": "stat",
          "title": "Burn Rate 30d",
          "description": "Monthly burn — should stay near 1.0 if on track.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "clamp_min((1 - (sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\", http_response_status_code!~\"5..\"}[30d])) / clamp_min(sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\"}[30d])), 1))) / clamp_min((1 - ($slo_availability_pct / 100)), 1e-9), 0)",
              "refId": "A",
              "legendFormat": "30d burn",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 1.5
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 115,
          "type": "timeseries",
          "title": "Burn Rate Over Time (1h / 6h / 3d)",
          "description": "Google SRE multi-window burn-rate chart for SLO alerting context.",
          "gridPos": {
            "h": 8,
            "w": 16,
            "x": 0,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "clamp_min((1 - (sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\", http_response_status_code!~\"5..\"}[1h])) / clamp_min(sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\"}[1h])), 1))) / clamp_min((1 - ($slo_availability_pct / 100)), 1e-9), 0)",
              "refId": "A",
              "legendFormat": "1h",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              }
            },
            {
              "expr": "clamp_min((1 - (sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\", http_response_status_code!~\"5..\"}[6h])) / clamp_min(sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\"}[6h])), 1))) / clamp_min((1 - ($slo_availability_pct / 100)), 1e-9), 0)",
              "refId": "B",
              "legendFormat": "6h",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              }
            },
            {
              "expr": "clamp_min((1 - (sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\", http_response_status_code!~\"5..\"}[3d])) / clamp_min(sum(increase(http_server_request_duration_count{job=~\"$service\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\"}[3d])), 1))) / clamp_min((1 - ($slo_availability_pct / 100)), 1e-9), 0)",
              "refId": "C",
              "legendFormat": "3d",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              }
            },
            {
              "expr": "1",
              "refId": "D",
              "legendFormat": "budget pace (=1)",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource_mimir}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
