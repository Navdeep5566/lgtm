apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: d1c-app-performance-deep-dive-v2
  namespace: observability
  labels:
    dashboards: grafana-lgtm
    app.kubernetes.io/name: d1c-app-performance-deep-dive-v2
    app.kubernetes.io/component: grafana-dashboard
    app.kubernetes.io/part-of: lgtm-observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-lgtm
  folder: LGTM
  json: |
    {
      "id": null,
      "uid": "d1c-app-perf-v2",
      "title": "D1C App - Application & DB Deep Dive (v2 Daily Ops)",
      "description": "NEW dashboard (uid d1c-app-perf-v2) — does not replace the original. Daily ops + deep dive: HTTP/API RED metrics, DB connection pools (HikariCP/OTel), Tomcat saturation, trace/span analysis, golden-signal gauges, and SRE triage tables. Datasources: Mimir (Prometheus) + Tempo.",
      "tags": [
        "d1c",
        "sre",
        "opentelemetry",
        "kubernetes",
        "database",
        "daily-ops",
        "v2"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 3,
      "refresh": "30s",
      "graphTooltip": 1,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m"
        ],
        "time_options": [
          "5m",
          "15m",
          "1h",
          "6h",
          "12h",
          "24h",
          "2d",
          "7d"
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource_mimir",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Mimir Datasource"
          },
          {
            "name": "datasource_tempo",
            "type": "datasource",
            "query": "tempo",
            "current": {},
            "hide": 0,
            "label": "Tempo Datasource"
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(target_info, k8s_namespace_name)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {},
            "hide": 0,
            "label": "Namespace",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "service",
            "type": "query",
            "datasource": {
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(http_server_request_duration_bucket, job)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "App / Job",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "http_route",
            "type": "query",
            "datasource": {
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(http_server_request_duration_bucket{job=~\"$service\"}, http_route)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "HTTP Route",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "http_method",
            "type": "query",
            "datasource": {
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(http_server_request_duration_bucket{job=~\"$service\"}, http_request_method)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "HTTP Method",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "pool_name",
            "type": "query",
            "datasource": {
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(db_client_connections_usage, pool_name)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "DB Pool",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "connector",
            "type": "query",
            "datasource": {
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(tomcat_request_count, tomcat_request_processor_name)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Tomcat Connector",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "span_service",
            "type": "query",
            "datasource": {
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(traces_span_metrics_calls_total, service_name)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Span Service",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "span_name",
            "type": "query",
            "datasource": {
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(traces_span_metrics_calls_total{service_name=~\"$span_service\"}, span_name)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Span Name",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "span_kind",
            "type": "custom",
            "query": "SPAN_KIND_SERVER,SPAN_KIND_CLIENT,SPAN_KIND_INTERNAL",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Span Kind"
          },
          {
            "name": "db_system",
            "type": "query",
            "datasource": {
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(traces_span_metrics_duration_bucket{service_name=~\"$span_service\", db_system!=\"\", db_system!=\"N/A\"}, db_system)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "DB System",
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "name": "Firing Alerts",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "enable": true,
            "hide": false,
            "iconColor": "red",
            "expr": "ALERTS{alertstate=\"firing\"}",
            "titleFormat": "{{alertname}}",
            "textFormat": "{{annotations.summary}}"
          }
        ]
      },
      "panels": [
        {
          "id": 300,
          "type": "row",
          "title": "HTTP / API Performance",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP Server Request Rate",
          "description": "Request throughput (RED: Rate). Excludes /actuator/health. Filter by App/Job, route, and method.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum by (job, http_route, http_request_method, http_response_status_code) (rate(http_server_request_duration_count{job=~\"$service\", http_route=~\"$http_route\", http_request_method=~\"$http_method\", http_route!=\"/actuator/health\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{job}} | {{http_request_method}} | {{http_route}} | {{http_response_status_code}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP Server Latency p50 / p95 / p99",
          "description": "Latency percentiles (RED: Duration). Watch p99 for tail latency impacting users. Excludes actuator and health URLs.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le, job, http_route) (rate(http_server_request_duration_bucket{job=~\"$service\", http_route=~\"$http_route\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\"}[5m])))",
              "refId": "A",
              "legendFormat": "p50 {{job}} | {{http_route}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, job, http_route) (rate(http_server_request_duration_bucket{job=~\"$service\", http_route=~\"$http_route\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\"}[5m])))",
              "refId": "B",
              "legendFormat": "p95 {{job}} | {{http_route}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le, job, http_route) (rate(http_server_request_duration_bucket{job=~\"$service\", http_route=~\"$http_route\", http_route!~\"/actuator.*|/health.*|/healthz|/ready|/readiness|/live|/liveliness|/ping\"}[5m])))",
              "refId": "C",
              "legendFormat": "p99 {{job}} | {{http_route}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "HTTP Error Rate by Route & Status",
          "description": "4xx/5xx error throughput (RED: Errors). Spike in 5xx usually indicates app/DB failures.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum by (job, http_route, http_request_method, http_response_status_code) (rate(http_server_request_duration_count{job=~\"$service\", http_route!=\"/actuator/health\", http_response_status_code=~\"[45]..\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{job}} | {{http_request_method}} | {{http_route}} | {{http_response_status_code}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "HTTP Client Latency by Upstream",
          "description": "Outbound HTTP client p95/p99 latency to upstream dependencies. High values indicate slow downstream services.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, job, server_address) (rate(http_client_request_duration_bucket{job=~\"$service\"}[5m])))",
              "refId": "A",
              "legendFormat": "p95 {{job}} -> {{server_address}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le, job, server_address) (rate(http_client_request_duration_bucket{job=~\"$service\"}[5m])))",
              "refId": "B",
              "legendFormat": "p99 {{job}} -> {{server_address}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "HTTP Status Code Mix",
          "description": "Traffic mix by response status class. Useful for spotting rising 4xx/5xx share during incidents.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 17
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_count{job=~\"$service\", http_route!=\"/actuator/health\", http_response_status_code=~\"2..\"}[5m]))",
              "refId": "A",
              "legendFormat": "2xx"
            },
            {
              "expr": "sum(rate(http_server_request_duration_count{job=~\"$service\", http_route!=\"/actuator/health\", http_response_status_code=~\"3..\"}[5m]))",
              "refId": "B",
              "legendFormat": "3xx"
            },
            {
              "expr": "sum(rate(http_server_request_duration_count{job=~\"$service\", http_route!=\"/actuator/health\", http_response_status_code=~\"4..\"}[5m]))",
              "refId": "C",
              "legendFormat": "4xx"
            },
            {
              "expr": "sum(rate(http_server_request_duration_count{job=~\"$service\", http_route!=\"/actuator/health\", http_response_status_code=~\"5..\"}[5m]))",
              "refId": "D",
              "legendFormat": "5xx"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "HTTP Success Rate %",
          "description": "Non-5xx success percentage over time. Market-standard availability SLI for daily ops.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 17
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "100 * (1 - (sum(rate(http_server_request_duration_count{job=~\"$service\", http_route!=\"/actuator/health\", http_response_status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_request_duration_count{job=~\"$service\", http_route!=\"/actuator/health\"}[5m])), 1e-9)))",
              "refId": "A",
              "legendFormat": "Success %"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 301,
          "type": "row",
          "title": "Database Connection Pool (HikariCP / OTel db.client)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 25
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "DB Pool Usage: Used / Idle / Max",
          "description": "Active vs idle connections against pool max. Used near Max with pending requests = saturation risk.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 26
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum by (pool_name) (db_client_connections_usage{job=~\"$service\", pool_name=~\"$pool_name\", state=\"used\"})",
              "refId": "A",
              "legendFormat": "Used - {{pool_name}}"
            },
            {
              "expr": "sum by (pool_name) (db_client_connections_usage{job=~\"$service\", pool_name=~\"$pool_name\", state=\"idle\"})",
              "refId": "B",
              "legendFormat": "Idle - {{pool_name}}"
            },
            {
              "expr": "sum by (pool_name) (db_client_connections_max{job=~\"$service\", pool_name=~\"$pool_name\"})",
              "refId": "C",
              "legendFormat": "Max - {{pool_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "DB Pool Pending Requests",
          "description": "Threads waiting for a free connection. Any sustained >0 is a production warning.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 26
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum by (pool_name) (db_client_connections_pending_requests{job=~\"$service\", pool_name=~\"$pool_name\"})",
              "refId": "A",
              "legendFormat": "Pending - {{pool_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "DB Pool Wait / Use / Create p99",
          "description": "p99 connection wait, use, and create times. Rising wait time often precedes API latency incidents.",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 34
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le, pool_name) (rate(db_client_connections_wait_time_bucket{job=~\"$service\", pool_name=~\"$pool_name\"}[5m])))",
              "refId": "A",
              "legendFormat": "Wait p99 {{pool_name}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le, pool_name) (rate(db_client_connections_use_time_bucket{job=~\"$service\", pool_name=~\"$pool_name\"}[5m])))",
              "refId": "B",
              "legendFormat": "Use p99 {{pool_name}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le, pool_name) (rate(db_client_connections_create_time_bucket{job=~\"$service\", pool_name=~\"$pool_name\"}[5m])))",
              "refId": "C",
              "legendFormat": "Create p99 {{pool_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "showPoints": "never",
