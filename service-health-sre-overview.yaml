apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: d1c-service-health-sre-overview-v2
  namespace: observability
  labels:
    dashboards: grafana-lgtm
    app.kubernetes.io/name: d1c-service-health-sre-overview-v2
    app.kubernetes.io/component: grafana-dashboard
    app.kubernetes.io/part-of: lgtm-observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-lgtm
  folder: LGTM
  json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "name": "Firing Alerts",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "enable": true,
            "hide": false,
            "iconColor": "red",
            "expr": "ALERTS{alertstate=\"firing\"}",
            "titleFormat": "{{alertname}}",
            "textFormat": "{{annotations.summary}}"
          }
        ]
      },
      "description": "Service-level signals including logs, errors, traces, and version health for the D1C Banking Applic | v2: original Loki panels preserved; added SRE First Look (Mimir golden signals) + Daily Ops panels at the bottom.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 16,
          "title": "🚨 Critical Indicators",
          "type": "row"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource_loki}"
          },
          "description": "Total count of ERROR-level log entries in the last hour. A spike indicates active incidents requ",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "red",
                    "value": 200
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "sum"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value_and_name",
            "widelayout": true
          },
          "pluginVersion": "13.0.1",
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource_loki}"
              },
              "direction": "backward",
              "editorMode": "code",
              "expr": "count_over_time({k8s_namespace_name=\"$namespace\", service_name=~\"$service\"} |= \"ERROR\" [1h])",
              "queryType": "instant",
              "refId": "A"
            }
          ],
          "title": "Total ERROR Logs (1h)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource_loki}"
          },
          "description": "Number of unique services currently emitting logs. If this drops below expected count, a service may be dow",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 2
                  },
                  {
                    "color": "green",
                    "value": 5
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "last"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "widelayout": true
          },
          "pluginVersion": "13.0.1",
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource_loki}"
              },
              "direction": "backward",
              "editorMode": "code",
              "expr": "count(count by (service_name) (rate({k8s_namespace_name=\"$namespace\"}[$__auto])))",
              "queryType": "instant",
              "refId": "A"
            }
          ],
          "title": "Active Services",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource_loki}"
          },
          "description": "Rate of OpenTelemetry Collector export failures per minute. Non-zero means telemetry data",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "sum"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "widelayout": true
          },
          "pluginVersion": "13.0.1",
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource_loki}"
              },
              "direction": "backward",
              "editorMode": "code",
              "expr": "sum(count_over_time({k8s_namespace_name=\"$namespace\"} |= \"UnknownHostException|ConnectException\" |= \"opentelemetry-collector\" [1m]))",
              "queryType": "instant",
              "refId": "A"
            }
          ],
          "title": "OTel Export Failures (/min)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource_loki}"
          },
          "description": "Number of unique pods experiencing UnknownHostException when trying to reach the OTel Collector. These pods have a complete telemetry bl",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "id": 13,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "last"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "widelayout": true
          },
