        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource_loki}"
          },
          "description": "Timeline of failed telemetry exports to the OTel Collector, separated by signal type (spans vs metrics). Persistent fail",
          "fieldConfig": {
