        {
          "datasource": {
            "type": "loki",
            "uid": "${datasource_loki}"
          },
          "description": "Rate of ERROR logs over time grouped by service. Helps identify which service is generating the most errors and when spikes occur.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "none",
                "hideFrom": {
