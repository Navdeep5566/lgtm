tolerations: []
# -- Extra affinity rules (nodeAffinity / podAffinity). Do not set podAntiAffinity here
# when podAntiAffinity.enabled is true; that is generated by the chart.
affinity: {}
# -- Soft/hard pod anti-affinity so replicas of this app avoid the same topology domain.
# Disabled by default; enable from the environment additional-values used during deployment.
podAntiAffinity:
  # -- Enable generated podAntiAffinity on the Deployment
  enabled: false
  # -- preferred = soft (scheduler will try); required = hard (pods must not share topologyKey)
  type: preferred
  # -- Topology domain to spread across. kubernetes.io/hostname = one pod per node (preferred)
  topologyKey: kubernetes.io/hostname
  # -- Weight used only when type is preferred (1-100)
  weight: 100
# -- Topology spread constraints for even distribution across zones and nodes.
# Disabled by default; enable from the environment additional-values used during deployment.
# labelSelector is injected from chart selector labels; do not hardcode app labels here.
topologySpreadConstraints:
  # -- Enable topologySpreadConstraints on the Deployment
  enabled: false
  constraints:
    # Spread evenly across AZ; ScheduleAnyway so a single-zone cluster can still schedule
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
    # Spread evenly across nodes
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
