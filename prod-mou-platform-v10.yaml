apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: prod-muq6-platform-ibm-mq
  namespace: observability
  labels:
    dashboards: grafana-lgtm
    app.kubernetes.io/name: prod-muq6-platform-ibm-mq
    app.kubernetes.io/component: grafana-dashboard
    app.kubernetes.io/part-of: lgtm-observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-lgtm
  folder: LGTM
  json: |
    {
      "id": null,
      "uid": "prod-muq6-platform-ibm-mq",
      "title": "PROD Platform - IBM MQ",
      "description": "IBM MQ platform monitoring — queue managers, queues, channels, and server logs. Metrics: ibmmq_* via Mimir; logs via Loki.",
      "tags": [
        "d1c",
        "ibm-mq",
        "prod",
        "platform",
        "middleware",
        "ibmmq"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "editable": true,
      "graphTooltip": 1,
      "liveNow": false,
      "fiscalYearStartMonth": 0,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m"
        ],
        "time_options": [
          "5m",
          "15m",
          "30m",
          "1h",
          "6h",
          "12h",
          "24h",
          "2d",
          "7d"
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "name": "Firing Alerts",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "enable": true,
            "hide": false,
            "iconColor": "red",
            "expr": "ALERTS{alertstate=\"firing\", alertname=~\".*MQ.*|.*IBM.*|.*Queue.*\"}",
            "titleFormat": "{{alertname}}",
            "textFormat": "{{annotations.summary}}"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource_mimir",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Mimir Datasource",
            "refresh": 1
          },
          {
            "name": "datasource_loki",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 0,
            "label": "Loki Datasource",
            "refresh": 1
          },
          {
            "name": "hostname",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values({__name__=~\"ibmmq_.*\"}, host_name)",
            "definition": "label_values({__name__=~\"ibmmq_.*\"}, host_name)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 2,
            "label": "Host (host_name)",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "hostname_alt",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values({__name__=~\"ibmmq_.*\"}, host_hostname)",
            "definition": "label_values({__name__=~\"ibmmq_.*\"}, host_hostname)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 2,
            "label": "Host (host_hostname)",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "qmgr",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values({__name__=~\"ibmmq_.*\"}, qmgr)",
            "definition": "label_values({__name__=~\"ibmmq_.*\"}, qmgr)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Queue Manager",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "queue",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(ibmmq_queue_mqput_mqput1_count, queue)",
            "definition": "label_values(ibmmq_queue_mqput_mqput1_count, queue)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Queue",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "channel",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values({__name__=~\"ibmmq_channel_.*\", qmgr=~\"$qmgr\"}, channel)",
            "definition": "label_values({__name__=~\"ibmmq_channel_.*\", qmgr=~\"$qmgr\"}, channel)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Channel",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "log_host",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource_loki}"
            },
            "query": "label_values({host_name=~\".+\"}, host_name)",
            "definition": "label_values({host_name=~\".+\"}, host_name)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Log Host (host_name)",
            "refresh": 2,
            "sort": 1,
            "description": "Discovered from Loki label `host_name` — works on any cluster, no hardcoded hostnames."
          },
          {
            "name": "log_host_alt",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource_loki}"
            },
            "query": "label_values({host=~\".+\"}, host)",
            "definition": "label_values({host=~\".+\"}, host)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Log Host (host)",
            "refresh": 2,
            "sort": 1,
            "description": "Discovered from Loki label `host` — works on any cluster, no hardcoded hostnames."
          },
          {
            "name": "log_hostname",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource_loki}"
            },
            "query": "label_values({hostname=~\".+\"}, hostname)",
            "definition": "label_values({hostname=~\".+\"}, hostname)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 2,
            "label": "Log Host (hostname)",
            "refresh": 2,
            "sort": 1,
            "description": "Discovered from Loki label `hostname` — works on any cluster, no hardcoded hostnames."
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Queue Managers",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Queue Managers",
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "description": "Unique queue managers from ibmmq_qmgr_active_listeners.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "count(count by (qmgr) (ibmmq_qmgr_active_listeners{qmgr=~\"$qmgr\"}))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Connections (current)",
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "description": "ibmmq_qmgr_active_listeners + ibmmq_qmgr_active_services.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum(ibmmq_qmgr_active_listeners{qmgr=~\"$qmgr\"}) + sum(ibmmq_qmgr_active_services{qmgr=~\"$qmgr\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Connections",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum by (qmgr) (ibmmq_qmgr_active_listeners{qmgr=~\"$qmgr\"}) + sum by (qmgr) (ibmmq_qmgr_active_services{qmgr=~\"$qmgr\"})",
              "refId": "A",
              "legendFormat": "{{qmgr}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 25,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Errors",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "description": "Sum of ibmmq_qmgr_failed_* operation counters.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum by (qmgr) (\n  avg_over_time(ibmmq_qmgr_failed_browse_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqget_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqinq_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqopen_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqput_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqput1_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqsubrq_count{qmgr=~\"$qmgr\"}[5m])\n)",
              "refId": "A",
              "legendFormat": "{{qmgr}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Messages",
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 0,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum(ibmmq_channel_messages{qmgr=~\"$qmgr\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Queues Count",
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 4,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "count(count by (queue) (ibmmq_queue_depth{queue=~\"$queue\"}))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Messages by Queue Manager",
          "gridPos": {
            "h": 6,
            "w": 16,
            "x": 8,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum by (qmgr) (ibmmq_channel_messages{qmgr=~\"$qmgr\"})",
              "refId": "A",
              "legendFormat": "{{qmgr}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 25,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 9,
          "type": "table",
          "title": "Queues info",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "max by (queue) (ibmmq_queue_depth{queue=~\"$queue\"})",
              "refId": "A",
              "format": "table",
              "instant": true
            },
            {
              "expr": "max by (queue) (ibmmq_queue_attribute_usage{queue=~\"$queue\"})",
              "refId": "B",
              "format": "table",
              "instant": true
            },
            {
              "expr": "max by (queue) (ibmmq_queue_mqput_mqput1_count{queue=~\"$queue\"})",
              "refId": "C",
              "format": "table",
              "instant": true
            },
            {
              "expr": "max by (queue) (ibmmq_queue_mqget_count{queue=~\"$queue\"})",
              "refId": "D",
              "format": "table",
              "instant": true
            },
            {
              "expr": "max by (queue) (ibmmq_queue_expired_messages{queue=~\"$queue\"})",
              "refId": "E",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "filterable": true
              }
            }
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {}
            },
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "FileSystem Usage",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum by (qmgr) (\n  avg_over_time(ibmmq_qmgr_queue_manager_file_system_in_use_bytes{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_log_file_system_in_use_bytes{qmgr=~\"$qmgr\"}[5m])\n)",
              "refId": "A",
              "legendFormat": "{{qmgr}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "type": "logs",
          "title": "Server Logs",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 28
          },
          "description": "Server logs from Loki for selected host(s). Hosts discovered via Log Host variables.",
          "datasource": {
            "type": "loki",
            "uid": "${datasource_loki}"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource_loki}"
              },
              "editorMode": "code",
              "expr": "{host_name=~\"$log_host\"}",
              "queryType": "range",
              "refId": "A",
              "direction": "backward"
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource_loki}"
              },
              "editorMode": "code",
              "expr": "{host=~\"$log_host_alt\"}",
              "queryType": "range",
              "refId": "B",
              "direction": "backward",
              "hide": true
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          }
        },
        {
          "id": 12,
          "type": "row",
          "title": "Queues",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 36
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 13,
          "type": "barchart",
          "title": "Queue Depth",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 37
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "topk(20, max by (queue) (ibmmq_queue_depth{queue=~\"$queue\"}))",
              "refId": "A",
              "legendFormat": "{{queue}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "orientation": "horizontal"
          }
        },
        {
          "id": 14,
          "type": "barchart",
          "title": "Queue Attribute Usage",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 37
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "topk(20, max by (queue) (ibmmq_queue_attribute_usage{queue=~\"$queue\"}))",
              "refId": "A",
              "legendFormat": "{{queue}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "orientation": "horizontal"
          }
        },
        {
          "id": 15,
          "type": "timeseries",
