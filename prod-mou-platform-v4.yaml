apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: prod-muq6-platform-ibm-mq
  namespace: observability
  labels:
    dashboards: grafana-lgtm
    app.kubernetes.io/name: prod-muq6-platform-ibm-mq
    app.kubernetes.io/component: grafana-dashboard
    app.kubernetes.io/part-of: lgtm-observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-lgtm
  folder: LGTM
  json: |
    {
      "id": null,
      "uid": "prod-muq6-platform-ibm-mq",
      "title": "PROD Platform - IBM MQ",
      "description": "IBM MQ dashboard mapped to ibmmq_* metrics in Mimir. v6: fixed PUT/GET/time-since queries + Loki logs matcher.",
      "tags": [
        "d1c",
        "ibm-mq",
        "prod",
        "platform",
        "middleware",
        "ibmmq"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 6,
      "refresh": "30s",
      "editable": true,
      "graphTooltip": 1,
      "liveNow": false,
      "fiscalYearStartMonth": 0,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m"
        ],
        "time_options": [
          "5m",
          "15m",
          "30m",
          "1h",
          "6h",
          "12h",
          "24h",
          "2d",
          "7d"
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "name": "Firing Alerts",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "enable": true,
            "hide": false,
            "iconColor": "red",
            "expr": "ALERTS{alertstate=\"firing\", alertname=~\".*MQ.*|.*IBM.*|.*Queue.*\"}",
            "titleFormat": "{{alertname}}",
            "textFormat": "{{annotations.summary}}"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource_mimir",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Mimir Datasource",
            "refresh": 1
          },
          {
            "name": "datasource_loki",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 0,
            "label": "Loki Datasource",
            "refresh": 1
          },
          {
            "name": "qmgr",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values({__name__=~\"ibmmq_.*\"}, qmgr)",
            "definition": "label_values({__name__=~\"ibmmq_.*\"}, qmgr)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Queue Manager",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "queue",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values({__name__=~\"ibmmq_queue_.*\", qmgr=~\"$qmgr\"}, queue)",
            "definition": "label_values({__name__=~\"ibmmq_queue_.*\", qmgr=~\"$qmgr\"}, queue)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Queue",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "channel",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "query": "label_values({__name__=~\"ibmmq_channel_.*\", qmgr=~\"$qmgr\"}, channel)",
            "definition": "label_values({__name__=~\"ibmmq_channel_.*\", qmgr=~\"$qmgr\"}, channel)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Channel",
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Diagnostics — IBM MQ metrics in Mimir",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "text",
          "title": "Metric naming in this environment",
          "gridPos": {
            "h": 4,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "options": {
            "mode": "markdown",
            "content": "**Your Mimir uses `ibmmq_*` metrics** (not `ibmq_*` from New Relic export naming).\n\nConfirmed in Explore: `topk(20, count by (__name__) ({qmgr=~\".+\"}))` returns **ibmmq_channel_***, **ibmmq_qmgr_***, **ibmmq_queue_*** metrics.\n\nPanels below filter by **Queue Manager** and **Queue** variables only."
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "IBM MQ metric names (ibmmq_*)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "count(count by (__name__) ({__name__=~\"ibmmq_.*\"}))",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "IBM MQ time series (ibmmq_*)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "count({__name__=~\"ibmmq_.*\"})",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Queue managers (qmgr label)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "count(count by (qmgr) ({__name__=~\"ibmmq_qmgr_.*\"}))",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 6,
          "type": "table",
          "title": "Top ibmmq_* metrics in Mimir",
          "gridPos": {
            "h": 5,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "topk(20, count by (__name__) ({__name__=~\"ibmmq_.*\"}))",
              "refId": "A",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "filterable": true
              }
            }
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "__name__": "Metric",
                  "Value": "Series count"
                }
              }
            }
          ]
        },
        {
          "id": 7,
          "type": "row",
          "title": "Queue Managers",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 10
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Queue Managers",
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 0,
            "y": 11
          },
          "description": "Unique queue managers from ibmmq_qmgr_active_listeners.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "count(count by (qmgr) (ibmmq_qmgr_active_listeners{qmgr=~\"$qmgr\"}))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Connections (listeners + services)",
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 4,
            "y": 11
          },
          "description": "ibmmq_qmgr_active_listeners + ibmmq_qmgr_active_services.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum(ibmmq_qmgr_active_listeners{qmgr=~\"$qmgr\"}) + sum(ibmmq_qmgr_active_services{qmgr=~\"$qmgr\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Connections",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 11
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum by (qmgr) (ibmmq_qmgr_active_listeners{qmgr=~\"$qmgr\"}) + sum by (qmgr) (ibmmq_qmgr_active_services{qmgr=~\"$qmgr\"})",
              "refId": "A",
              "legendFormat": "{{qmgr}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 25,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Errors",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 11
          },
          "description": "Sum of ibmmq_qmgr_failed_* operation counters.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum by (qmgr) (\n  avg_over_time(ibmmq_qmgr_failed_browse_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqget_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqinq_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqopen_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqput_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqput1_count{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_failed_mqsubrq_count{qmgr=~\"$qmgr\"}[5m])\n)",
              "refId": "A",
              "legendFormat": "{{qmgr}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Channel Messages",
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 0,
            "y": 17
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum(ibmmq_channel_messages{qmgr=~\"$qmgr\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Queues Count",
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 4,
            "y": 17
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "count(count by (queue) (ibmmq_queue_depth{qmgr=~\"$qmgr\", queue=~\"$queue\"}))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Channel Messages by QMGR",
          "gridPos": {
            "h": 6,
            "w": 16,
            "x": 8,
            "y": 17
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum by (qmgr) (ibmmq_channel_messages{qmgr=~\"$qmgr\"})",
              "refId": "A",
              "legendFormat": "{{qmgr}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 25,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 15,
          "type": "table",
          "title": "Queues info",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "max by (qmgr, queue) (ibmmq_queue_depth{qmgr=~\"$qmgr\", queue=~\"$queue\"})",
              "refId": "A",
              "format": "table",
              "instant": true
            },
            {
              "expr": "max by (qmgr, queue) (ibmmq_queue_attribute_usage{qmgr=~\"$qmgr\", queue=~\"$queue\"})",
              "refId": "B",
              "format": "table",
              "instant": true
            },
            {
              "expr": "max by (qmgr, queue) (ibmmq_queue_mqput_count{qmgr=~\"$qmgr\", queue=~\"$queue\"})",
              "refId": "C",
              "format": "table",
              "instant": true
            },
            {
              "expr": "max by (qmgr, queue) (ibmmq_queue_mqget_count{qmgr=~\"$qmgr\", queue=~\"$queue\"})",
              "refId": "D",
              "format": "table",
              "instant": true
            },
            {
              "expr": "max by (qmgr, queue) (ibmmq_queue_expired_messages{qmgr=~\"$qmgr\", queue=~\"$queue\"})",
              "refId": "E",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "filterable": true
              }
            }
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {}
            },
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ]
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "FileSystem Usage",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 31
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum by (qmgr) (\n  avg_over_time(ibmmq_qmgr_queue_manager_file_system_in_use_bytes{qmgr=~\"$qmgr\"}[5m]) +\n  avg_over_time(ibmmq_qmgr_log_file_system_in_use_bytes{qmgr=~\"$qmgr\"}[5m])\n)",
              "refId": "A",
              "legendFormat": "{{qmgr}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth",
                "showPoints": "never",
                "spanNulls": true
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "mean",
                "max"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 17,
          "type": "logs",
          "title": "MQ Server Logs",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 38
          },
          "description": "Loki logs for IBM MQ. Filters by qmgr label (select a Queue Manager if empty). NR equivalent: host.hostname LIKE %muobprodmq%.",
          "datasource": {
            "type": "loki",
            "uid": "${datasource_loki}"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource_loki}"
              },
              "editorMode": "code",
              "expr": "{qmgr=~\"$qmgr\"}",
              "queryType": "range",
              "refId": "A",
              "direction": "backward"
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "${datasource_loki}"
              },
              "editorMode": "code",
