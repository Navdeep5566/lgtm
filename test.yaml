apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: d1c-infrastructure-node-health
  namespace: observability
  labels:
    dashboards: grafana-lgtm
    app.kubernetes.io/name: d1c-infrastructure-node-health
    app.kubernetes.io/component: grafana-dashboard
    app.kubernetes.io/part-of: lgtm-observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-lgtm
  folder: LGTM
  json: |
    {
      "id": null,
      "uid": "d1c-infra-health",
      "title": "D1C App - Infrastructure & Node Health",
      "description": "Host-level metrics including CPU, memory, disk, filesystem, network, paging, and process health for the D1C Banking Application infrastructure",
      "tags": ["d1c", "sre", "opentelemetry", "kubernetes", "node-health"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "fiscalYearStartMonth": 0,
      "liveNow": false,
      "weekStart": "",
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "name": "Prometheus Alerts",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "enable": true,
            "hide": false,
            "iconColor": "red",
            "expr": "ALERTS{alertstate=\"firing\", alertname=~\".*[Nn]ode.*|.*[Mm]emory.*|.*[Cc]PU.*|.*[Dd]isk.*\"}",
            "tagKeys": "alertname,severity,severity",
            "titleFormat": "{{alertname}}",
            "textFormat": "{{annotations.summary}}",
            "useValueForTime": false
          },
          {
            "name": "Node Not Ready",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource_mimir}"
            },
            "enable": true,
            "hide": false,
            "iconColor": "orange",
            "expr": "kube_node_status_condition{condition=\"Ready\", status=\"true\"} == 0",
            "tagKeys": "node",
            "titleFormat": "Node Not Ready: {{node}}",
            "textFormat": "Kubernetes node {{node}} is not Ready",
            "useValueForTime": false
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource_mimir",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Mimir Datasource"
          },
          {
            "name": "cpu",
            "type": "custom",
            "query": "cpu0,cpu1,cpu2,cpu3,cpu4,cpu5,cpu6,cpu7",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "CPU"
          },
          {
            "name": "device",
            "type": "custom",
            "query": "lo,eth0",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Network Device"
          },
          {
            "name": "node",
            "type": "query",
            "datasource": {
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(system_cpu_time, host_name)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Node"
          },
          {
            "name": "disk",
            "type": "query",
            "datasource": {
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(system_disk_io, device)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Disk Device",
            "refresh": 2
          },
          {
            "name": "mountpoint",
            "type": "query",
            "datasource": {
              "uid": "${datasource_mimir}"
            },
            "query": "label_values(system_filesystem_utilization, mountpoint)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "label": "Mountpoint",
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 200,
          "type": "row",
          "title": "🖥 CPU Overview",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 1,
          "type": "gauge",
          "title": "Overall CPU Utilization %",
          "description": "Average CPU utilization across all cores (100% minus idle). Values above 85% indicate the node is under heavy load...",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "100 * (1 - sum(rate(system_cpu_time{state=\"idle\",cpu=~\"$cpu\"}[5m])) / sum(rate(system_cpu_time{cpu=~\"$cpu\"}[5m])))",
              "refId": "A",
              "legendFormat": "CPU Util %"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            },
            "showThresholdMarkers": true,
            "showThresholdLabels": false
          }
        },
        {
          "id": 2,
          "type": "gauge",
          "title": "Memory Utilization %",
          "description": "Percentage of total memory currently in use. Above 90% risks OOM kills on pods.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "100 * sum(system_memory_usage{state=\"used\"}) / sum(system_memory_usage{state=~\"used|free|buffered|cached\"})",
              "refId": "A",
              "legendFormat": "Memory Util %"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            },
            "showThresholdMarkers": true,
            "showThresholdLabels": false
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Total Memory Used",
          "description": "Absolute amount of memory currently in use (bytes). Compare with total to assess headroom.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "system_memory_usage{state=\"used\"}",
              "refId": "A",
              "legendFormat": "Used"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 51539607552
                  },
                  {
                    "color": "red",
                    "value": 61917364224
                  }
                ]
              },
              "unit": "bytes"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            },
            "colorMode": "background",
            "graphMode": "area"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Total Memory Free",
          "description": "Available free memory. If this drops below a few GB, the node is at risk of memory pressure.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "system_memory_usage{state=\"free\"}",
              "refId": "A",
              "legendFormat": "Free"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 4294967296
                  },
                  {
                    "color": "green",
                    "value": 8589934592
                  }
                ]
              },
              "unit": "bytes"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            },
            "colorMode": "background",
            "graphMode": "area"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU Time per State",
          "description": "Stacked view of CPU time breakdown by state (user/system/wait/steal/softirq). High 'steal' indicates noisy neighbor issues.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 7
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "avg by (state) (rate(system_cpu_time{cpu=~\"$cpu\", state=~\"user|system|wait|steal|softirq\"}[$__interval]))",
              "legendFormat": "{{state}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal"
                },
                "lineInterpolation": "smooth"
              },
              "unit": "s"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["last", "min", "max"]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "CPU Load Averages (1m / 5m / 15m)",
          "description": "System load averages indicating run queue depth. Thresholds at 4.0 (warning) and 8.0 (critical) represent per-core limits.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 7
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "system_cpu_load_average_1m",
              "legendFormat": "Load 1m",
              "refId": "A"
            },
            {
              "expr": "system_cpu_load_average_5m",
              "legendFormat": "Load 5m",
              "refId": "B"
            },
            {
              "expr": "system_cpu_load_average_15m",
              "legendFormat": "Load 15m",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "thresholdsStyle": {
                  "mode": "dashed+area"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 4
                  },
                  {
                    "color": "red",
                    "value": 8
                  }
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["last", "min", "max"]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 201,
          "type": "row",
          "title": "🌐 Network",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Network I/O Throughput",
          "description": "Bytes per second transmitted and received on the selected network device. Sustained high throughput may indicate bandwidth exhaustion.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "rate(system_network_io{device=~\"$device\", direction=\"transmit\"}[$__interval])",
              "legendFormat": "TX {{device}}",
              "refId": "A"
            },
            {
              "expr": "rate(system_network_io{device=~\"$device\", direction=\"receive\"}[$__interval])",
              "legendFormat": "RX {{device}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth"
              },
              "unit": "Bps"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["last", "min", "max"]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Network Packets/sec",
          "description": "Packet rate on network interfaces. Useful for detecting packet storms or DDoS-like patterns.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "rate(system_network_packets{device=~\"$device\", direction=\"transmit\"}[$__interval])",
              "legendFormat": "TX pkts {{device}}",
              "refId": "A"
            },
            {
              "expr": "rate(system_network_packets{device=~\"$device\", direction=\"receive\"}[$__interval])",
              "legendFormat": "RX pkts {{device}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth"
              },
              "unit": "pps"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["last", "min", "max"]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Network Errors Total",
          "description": "Total network errors (TX + RX) across all devices. Any non-zero value warrants investigation into NIC or driver health.",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 24
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum(system_network_errors)",
              "refId": "A",
              "legendFormat": "Errors"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 100
                  }
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            },
            "colorMode": "background",
            "graphMode": "area"
          }
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Dropped Packets Total",
          "description": "Total dropped packets across all interfaces. Drops indicate kernel buffer exhaustion or rate limiting.",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 24
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "sum(system_network_dropped)",
              "refId": "A",
              "legendFormat": "Dropped"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 50
                  }
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            },
            "colorMode": "background",
            "graphMode": "area"
          }
        },
        {
          "id": 11,
          "type": "barchart",
          "title": "TCP Connections by State",
          "description": "Distribution of TCP connections across states. High TIME_WAIT may indicate connection churn.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "system_network_connections{protocol=\"tcp\"}",
              "legendFormat": "{{state}}",
              "refId": "A",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short"
            }
          },
          "options": {
            "orientation": "horizontal",
            "showValue": "always",
            "barWidth": 0.7
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "TCP ESTABLISHED Connections Trend",
          "description": "Trend of ESTABLISHED TCP connections over time. A sudden drop may indicate service degradation.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 28
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "system_network_connections{protocol=\"tcp\", state=\"ESTABLISHED\"}",
              "legendFormat": "ESTABLISHED",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth"
              },
              "unit": "short"
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["last", "min", "max"]
            },
            "tooltip": {
              "mode": "single"
            }
          }
        },
        {
          "id": 202,
          "type": "row",
          "title": "📑 Paging & Memory Pressure",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 36
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Page Faults Over Time",
          "description": "Major vs minor page faults. Major faults require disk I/O and significantly impact performance.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 37
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "rate(system_paging_faults{type=\"major\"}[$__interval])",
              "legendFormat": "Major Faults",
              "refId": "A"
            },
            {
              "expr": "rate(system_paging_faults{type=\"minor\"}[$__interval])",
              "legendFormat": "Minor Faults",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineInterpolation": "smooth"
              },
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Major Faults"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Minor Faults"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "blue",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["last", "min", "max"]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Paging Operations Rate",
          "description": "Rate of paging operations (page_in and page_out) by type. High page_out rates indicate the system is actively swapping memory to disk.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 37
          },
          "datasource": {
            "uid": "${datasource_mimir}"
          },
          "targets": [
            {
              "expr": "rate(system_paging_operations{direction=\"page_in\", type=\"major\"}[$__interval])",
              "legendFormat": "Page In (major)",
              "refId": "A"
            },
            {
              "expr": "rate(system_paging_operations{direction=\"page_out\", type=\"major\"}[$__interval])",
              "legendFormat": "Page Out (major)",
              "refId": "B"
            },
            {
              "expr": "rate(system_paging_operations{direction=\"page_in\", type=\"minor\"}[$__interval])",
              "legendFormat": "Page In (minor)",
              "refId": "C"
            },
            {
              "expr": "rate(system_paging_operations{direction=\"page_out\", type=\"minor\"}[$__interval])",
              "legendFormat": "Page Out (minor)",
              "refId": "D"
            }
          ],
